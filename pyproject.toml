[project]
name = "uvc-lab"
version = "0.1.0"
description = "Browser-based UVC camera lab: live preview, preset benchmarks, and capture experiments for physical UVC cameras"
requires-python = ">=3.10"
dependencies = [
    "opencv-python>=4.9",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]
